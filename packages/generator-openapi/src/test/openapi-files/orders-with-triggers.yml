openapi: '3.0.0'
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: placeOrder
      summary: Place an order
      x-eventcatalog-message-type: command
      # PlaceOrder is received over HTTP, and the handler then publishes ProcessOrder to a queue
      x-eventcatalog-triggers:
        - id: ProcessOrder
          version: 1.0.0
          condition: Order is valid
        - id: DoesNotExist
      responses:
        '202':
          description: Accepted
